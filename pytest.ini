# The suite's own config, and it exists for one line.
#
# `tmp_path` dirs are kept for every test by default, and pytest garbage
# collects only the numbered run directories, three deep. So the suite's
# footprint on disk is every artifact every passing test built, times the
# three most recent runs, and on a host where twelve seats share one volume
# that is a cost the suite imposes on every other seat rather than on itself.
#
# Measured on 2026-11-09 against `tests/test_plugin_manifest.py` alone: 98
# directories and 2.9M per run with the default, 1 directory and 4.0K with the
# policy below, because every test in that file passes and a passing test's
# scratch tree is read by nobody. The whole suite's 491M in 22 surviving run
# directories was the same arithmetic at the library's scale.
#
# `failed` rather than `none` on purpose. The one time a scratch tree is worth
# reading is when the test that built it went red, and this keeps exactly
# those. A green run leaves nothing and a red run leaves the evidence.
#
# rootdir does not move: it already resolves to this directory, so this file
# changes the retention and nothing else.
[pytest]
tmp_path_retention_policy = failed
