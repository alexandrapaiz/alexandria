  # ---- agent containment (Layer 4's named priority, owner's order 2026-09-19;
  # research note 2026-09-30 section 6d). The corpus holds ZERO containment
  # claims: the 24 that a keyword match credits to the thread are about terminal
  # agents, token efficiency, GUI skills and multi-agent benchmarks, not about a
  # boundary. The rubric this thread needs is an isolation design with a measured
  # escape or a measured cost, and arXiv mostly does not carry that -- the people
  # who run isolation at scale write it up themselves. All verified 2026-09-30,
  # HTTP 200 with parseable entries.
  #
  # gVisor's blog is the rubric in feed form: "Scaling Agentic-RL Sandboxes to
  # the Millions with gVisor at Tencent" (2026-04-23), "Multi-Agent gVisor
  # Isolation (MAGI)" (2026-04-15), "Optimizing seccomp usage in gVisor", "Safe
  # Ride into the Dangerzone: Reducing attack surface with gVisor". Ten entries
  # spanning 2023-2026, so it costs the triage budget almost nothing, which
  # matters while triage reads 3-15 percent of its intake.
  - {name: gvisor, url: "https://gvisor.dev/blog/index.xml", tier: d}
  # microVMs and the wasm runtime, the two isolation models the charter names
  # beside sandboxes. Release feeds, so the unit is a release: triage routes
  # capability releases to index/distill and patch releases to discard.
  - {name: gh-firecracker, url: "https://github.com/firecracker-microvm/firecracker/releases.atom", tier: d}
  - {name: gh-wasmtime, url: "https://github.com/bytecodealliance/wasmtime/releases.atom", tier: d}
  # Checked and declined on 2026-09-30, recorded so the next census does not
