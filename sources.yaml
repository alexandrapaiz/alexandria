# Ingestion sources. Tier is a triage prior, carried on every paper row:
#   a      firehose (arXiv categories) — neutral prior
#   a-low  firehose, noisy category — extra skepticism
#   b      human-curated paper picks — strong prior; upgrades a paper already seen in tier a
#   c      frontier/open-lab owned channels — strong prior
#   d      trusted practitioners — moderate prior
# The meta-review may propose diffs to this file (ADR-7).

arxiv:
  - {category: cs.CL, tier: a}
  - {category: cs.AI, tier: a}
  - {category: cs.MA, tier: a}
  - {category: cs.IR, tier: a}
  - {category: cs.LG, tier: a-low}
  - {category: cs.DC, tier: a-low}   # systems/distributed papers; ML-systems work often lands here
  # Agent containment's actual arXiv home (research brief 2026-09-19). Measured
  # 2026-09-19 against the live arXiv API: 45 of the 100 most recent cs.CR papers
  # matching abs:"agent" carry no cross-list into any category above, so ~7
  # agent-security papers a day were structurally unreachable — including
  # "Authorization Architectures for Tool-Using AI Agents" (2609.15906), "Trust
  # propagation and structural containment in Multi-agent LLM pipelines"
  # (2609.17648), and "SkillSecurer" (2609.14079), which is about prompt-injection
  # in agent skills, the artifact this project sells. a-low, not a: cs.CR runs ~34
  # papers/day and most of it is blockchain, network and crypto work, not agents.
  - {category: cs.CR, tier: a-low}

hf_daily_papers:
  url: https://huggingface.co/api/daily_papers
  tier: b

feeds:
  # anthropic.com has no RSS feed (verified 2026-09-07; every plausible path 404s).
  # Coverage comes from transformer-circuits + arXiv + hf-daily; a news-page
  # scraper is a candidate meta-review proposal.
  - {name: transformer-circuits, url: "https://transformer-circuits.pub/feed.xml", tier: c}
  - {name: openai, url: "https://openai.com/news/rss.xml", tier: c}
  - {name: deepmind, url: "https://deepmind.google/blog/rss.xml", tier: c}
  - {name: google-research, url: "https://research.google/blog/rss/", tier: c}
  - {name: thinking-machines, url: "https://thinkingmachines.ai/index.xml", tier: c}
  - {name: qwen, url: "https://qwenlm.github.io/blog/index.xml", tier: c}
  # ai.meta.com has no RSS (verified 2026-09-07); engineering.fb.com carries
  # Meta's systems/infra writing, which is the half we most want anyway
  - {name: meta-engineering, url: "https://engineering.fb.com/feed/", tier: c}
  - {name: stanford-sail, url: "https://ai.stanford.edu/blog/feed.xml", tier: d}
  - {name: mit-news-ai, url: "https://news.mit.edu/rss/topic/artificial-intelligence2", tier: d}
  - {name: mit-csail, url: "https://www.csail.mit.edu/rss.xml", tier: d}
  - {name: simonwillison, url: "https://simonwillison.net/atom/everything/", tier: d}
  - {name: interconnects, url: "https://www.interconnects.ai/feed", tier: d}
  - {name: raschka-ahead-of-ai, url: "https://magazine.sebastianraschka.com/feed", tier: d}
  - {name: raschka-blog, url: "https://sebastianraschka.com/rss_feed.xml", tier: d}
  - {name: langchain, url: "https://www.langchain.com/blog/rss.xml", tier: d}
  - {name: langchain-blog, url: "https://blog.langchain.com/rss/", tier: d}
  # ---- tools & software: GitHub release feeds (releases.atom, all verified 200) ----
  # The unit here is a release, not a paper: triage routes major capability
  # releases to index/distill and patch releases to discard (see prompts/triage.md).
  # ---- ecosystem awareness: lab blogs and front-page signal (owner order,
  # 2026-09-19, incident 19). The unit is an ecosystem event, not a paper:
  # these exist so the digest is never again unaware of what the world knows
  # (the Hugging Face incident went uncaptured). Triage routes technical
  # substance to index and news-only items to discard; they steer curation
  # (research charter's signal read) and are never laundered into claims.
  # ---- agent interop & identity (incident 21: the first agent user found
  # nothing on identity/portability; this territory lives in standards bodies
  # and protocol repos, not arXiv) ----
  - {name: gh-a2a-protocol, url: "https://github.com/a2aproject/A2A/releases.atom", tier: d}
  - {name: gh-spiffe, url: "https://github.com/spiffe/spiffe/releases.atom", tier: d}
  - {name: hf-blog, url: "https://huggingface.co/blog/feed.xml", tier: d}
  # openai-blog and deepmind-blog were added here on 2026-09-19 and removed on
  # 2026-09-21 (research meta-review): both carried URLs byte-identical to the
  # `openai` and `deepmind` entries above, so every item was ingested twice under
  # two different tier priors. Measured in the corpus on 2026-09-21: source
  # `openai-blog` holds 1210 rows at tier d against 38 at tier c for `openai`,
  # and `deepmind-blog` 100 at tier d against 2 at tier c, all of the tier-d rows
  # landing in a single 2026-09-20 ingest. The lab feeds are kept at tier c,
  # which is the tier the legend defines for open-lab owned channels; the
  # ecosystem-awareness intent of the 2026-09-19 addition is unaffected, because
  # the same URL is still ingested, once, with the stronger prior. Do not re-add
  # a second entry for a URL already listed above.
  - {name: hn-frontpage, url: "https://hnrss.org/frontpage", tier: d}
  - {name: gh-vllm, url: "https://github.com/vllm-project/vllm/releases.atom", tier: d}
  - {name: gh-sglang, url: "https://github.com/sgl-project/sglang/releases.atom", tier: d}
  - {name: gh-llamacpp, url: "https://github.com/ggml-org/llama.cpp/releases.atom", tier: d}
  - {name: gh-transformers, url: "https://github.com/huggingface/transformers/releases.atom", tier: d}
  - {name: gh-langgraph, url: "https://github.com/langchain-ai/langgraph/releases.atom", tier: d}
  # gh-autogen is the reference line, kept for its archive: its newest release is
  # python-v0.7.5 (2025-09-30). Active development moved to the AG2 fork, which
  # shipped v1.0.1-v1.0.5 between 2026-07-29 and 2026-09-11 (research brief 2026-09-19 §1.4).
  - {name: gh-autogen, url: "https://github.com/microsoft/autogen/releases.atom", tier: d}
  - {name: gh-ag2, url: "https://github.com/ag2ai/ag2/releases.atom", tier: d}
  - {name: gh-openai-agents, url: "https://github.com/openai/openai-agents-python/releases.atom", tier: d}
  - {name: gh-crewai, url: "https://github.com/crewAIInc/crewAI/releases.atom", tier: d}
  # Durable execution predates LLM agents and is the lineage the frameworks draw on
  # for checkpoint/resume (research brief 2026-09-19 §1.2).
  - {name: gh-temporal, url: "https://github.com/temporalio/temporal/releases.atom", tier: d}
  - {name: gh-mcp-spec, url: "https://github.com/modelcontextprotocol/modelcontextprotocol/releases.atom", tier: d}
  - {name: gh-claude-code, url: "https://github.com/anthropics/claude-code/releases.atom", tier: d}
  - {name: gh-ollama, url: "https://github.com/ollama/ollama/releases.atom", tier: d}
