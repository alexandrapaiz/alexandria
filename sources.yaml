  - {name: meta-engineering, url: "https://engineering.fb.com/feed/", tier: c}
  # ---- engineering practice: what people ran in production, and what broke.
  # First of the five engineering blogs the corpus-expansion spike asks for
  # (docs/ideas.md, accepted 2026-09-18); the others follow once this one has
  # a week of triage decisions to judge it by. Cloudflare first because its
  # writing is mechanism-first with real numbers, and because agent
  # infrastructure (sandboxes, per-agent access, preview environments) is now
  # a standing subject there rather than an occasional one. Verified 200 with
  # 20 items and per-item summaries on 2026-09-23. It is a high-volume general
  # engineering feed, so most of it is DNS, cache and security work that triage
  # should discard; prompts/triage.md now knows what a practice report is.
  - {name: cloudflare-engineering, url: "https://blog.cloudflare.com/rss/", tier: d}
  - {name: stanford-sail, url: "https://ai.stanford.edu/blog/feed.xml", tier: d}
  - {name: mit-news-ai, url: "https://news.mit.edu/rss/topic/artificial-intelligence2", tier: d}
  - {name: mit-csail, url: "https://www.csail.mit.edu/rss.xml", tier: d}
  - {name: simonwillison, url: "https://simonwillison.net/atom/everything/", tier: d}
  - {name: interconnects, url: "https://www.interconnects.ai/feed", tier: d}
  - {name: raschka-ahead-of-ai, url: "https://magazine.sebastianraschka.com/feed", tier: d}
  - {name: raschka-blog, url: "https://sebastianraschka.com/rss_feed.xml", tier: d}
  - {name: langchain, url: "https://www.langchain.com/blog/rss.xml", tier: d}
  # ---- reasoning models (owner's directive 2026-09-26; Layer 3a). The corpus
  # holds 209 reasoning-titled papers and 48 claims that mention reasoning, and
  # only 3 of those claims touch verifiable reward and 1 touches test-time
  # compute. The two people the charter names as radar, Lambert and Raschka,
  # were already ingested (interconnects, raschka-*, above), so the reach gap is
  # institutional, not personal. These two close the named half of it. Both
  # verified 2026-09-26 by fetching the URL: 200 with parseable entries.
  #
  # Ai2 is the institutional home of the RLVR line — the term was coined in the
  # Tulu 3 work and the Olmo post-training stack is the open reference recipe —
  # and it is where Lambert's former team publishes the method behind what he
  # writes about. Tier c, an open-lab owned channel, which is what the legend
  # above defines that tier for. Feed carries 25 items including "What a
  # crowdsourced game revealed about steering Olmo 3" and "How Goodfire used
  # Ai2's open post-training stack to trace unwanted model behavior".
  - {name: ai2, url: "https://allenai.org/rss.xml", tier: c}
  # Lil'Log is the long-form reference writing on exactly this layer: "Why We
  # Think" is the test-time-compute survey the corpus has one claim about, and
  # "Reward Hacking in Reinforcement Learning" is the reward-design piece the
  # charter's standing question asks for. Low volume, 53 entries over years, so
  # it costs the triage budget almost nothing. Tier d, a trusted practitioner,
  # the same tier as the other two named individuals.
  - {name: lilianweng, url: "https://lilianweng.github.io/index.xml", tier: d}
  - {name: langchain-blog, url: "https://blog.langchain.com/rss/", tier: d}
  # ---- tools & software: GitHub release feeds (releases.atom, all verified 200) ----
  # The unit here is a release, not a paper: triage routes major capability
  # releases to index/distill and patch releases to discard (see prompts/triage.md).
  # ---- ecosystem awareness: lab blogs and front-page signal (owner order,
  # 2026-09-19, incident 19). The unit is an ecosystem event, not a paper:
  # these exist so the digest is never again unaware of what the world knows
  # (the Hugging Face incident went uncaptured). Triage routes technical
  # substance to index and news-only items to discard; they steer curation
  # (research charter's signal read) and are never laundered into claims.
  # ---- agent interop & identity (incident 21: the first agent user found
  # nothing on identity/portability; this territory lives in standards bodies
  # and protocol repos, not arXiv) ----
  - {name: gh-a2a-protocol, url: "https://github.com/a2aproject/A2A/releases.atom", tier: d}
  # The releases feeds above and below carry the tag and nothing else. Measured
  # 2026-09-30: gh-a2a-protocol and gh-mcp-spec have delivered 18 rows between
  # them, every title a bare version or date string ("v1.0.1", "2026-07-28 RC"),
  # every abstract empty, every fulltext_chars null, and all 18 indexed. That is
  # not triage missing substance; there is no substance in the row, because
  # releases.atom on a specification repository returns the tag while the
  # normative change lives in the spec tree. These three are the changelogs the
  # releases feeds are not (owner directive 2026-09-29: "spec changelogs, not
  # only releases"). All verified 2026-09-30: HTTP 200, 20 entries each, and the
  # path filter genuinely narrows -- the spec-path feed returns different commits
  # than the whole-branch feed. The releases entries are kept, because a new
  # protocol version is still a signal worth one row.
  #
  # seps.atom is the highest-signal of the three: MCP's normative change runs
  # through a numbered Specification Enhancement Proposal process, and its
  # commit messages name the substance ("Add Agent Skills backward-compatibility
  # requirement", "Require WG/IG discussion before SEP submission"). Following
  # it is how this project found SEP-2640, "Skills Extension", status Final,
  # which standardizes serving Agent Skills over MCP -- a Final standard on the
  # library that is this project's terminal asset, invisible to the corpus for
  # five months. Most items in all three feeds are spec-text maintenance that
  # triage should discard.
  - {name: gh-mcp-spec-changelog, url: "https://github.com/modelcontextprotocol/modelcontextprotocol/commits/main/docs/specification.atom", tier: d}
  - {name: gh-mcp-seps, url: "https://github.com/modelcontextprotocol/modelcontextprotocol/commits/main/seps.atom", tier: d}
  - {name: gh-a2a-spec-changelog, url: "https://github.com/a2aproject/A2A/commits/main/specification.atom", tier: d}
  # The Agent Skills specification that SEP-2640 delegates the skill format to
  # (directory shape, YAML frontmatter, progressive disclosure) lives at
  # agentskills.io, which publishes no feed (/feed.xml and /rss.xml both 404 on
  # 2026-09-30). This is its development repository and the working proxy. 200.
  - {name: gh-mcp-ext-skills, url: "https://github.com/modelcontextprotocol/ext-skills/commits/main.atom", tier: d}
  - {name: gh-spiffe, url: "https://github.com/spiffe/spiffe/releases.atom", tier: d}
  - {name: hf-blog, url: "https://huggingface.co/blog/feed.xml", tier: d}
  # openai-blog and deepmind-blog were added here on 2026-09-19 and removed on
  # 2026-09-21 (research meta-review): both carried URLs byte-identical to the
  # `openai` and `deepmind` entries above, so every item was ingested twice under
