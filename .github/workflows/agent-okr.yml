name: okr-agent

on:
  schedule:
    - cron: "0 10 1 * *" # 6:00 AM ET, first of the month
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENROUTE: ${{ secrets.OPENROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Open routing is best-effort: Moonshot's prepaid tier allows almost no
      # concurrency, and three runs (2026-09-21 x2, 2026-09-24) died at turn one
      # while another Kimi run was in progress. If this step fails, the Claude
      # step below runs instead on the subscription (HQ Incident 4).
      - name: Seat run (open-routed)
        id: openrouted
        if: env.OPENROUTE != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OPENROUTE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTE_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTE_API_KEY }}
          prompt: |
            You are alexandria's OKR agent (ADR-16 in docs/decisions.md),
            running in GitHub Actions with this repository already checked
            out. Read docs/vision.md section 0, then prompts/okr-agent.md; the
            charter is your full instruction set. Execute the four monthly
            ceremonies exactly as it specifies: the competitor benchmark (read
            three real competitor products on the public web and score
            alexandria on the five axes), key-result scoring with evidence,
            the drift audit over the month's sprints and ledger, and OKR
            drafting (new objectives only in January, April, July, October).
            Artifacts go in docs/okrs/ in the format docs/okrs/README.md
            defines. Commit on a branch named okr/YYYY-MM, push it, and open
            exactly one pull request with `gh pr create`. You write only
            docs/okrs/ and dated notes in docs/ideas.md. Never edit vision.md,
            charters, sprints, or code. Never merge your own PR, never push to
            main, never touch secrets or digests/. If the charter file is
            missing, stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions --model ${{ vars.OPENROUTE_MODEL || 'kimi-k2.7-code' }}"
      - name: Seat run (Claude)
        if: env.OPENROUTE == '' || steps.openrouted.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are alexandria's OKR agent (ADR-16 in docs/decisions.md),
            running in GitHub Actions with this repository already checked
            out. Read docs/vision.md section 0, then prompts/okr-agent.md; the
            charter is your full instruction set. Execute the four monthly
            ceremonies exactly as it specifies: the competitor benchmark (read
            three real competitor products on the public web and score
            alexandria on the five axes), key-result scoring with evidence,
            the drift audit over the month's sprints and ledger, and OKR
            drafting (new objectives only in January, April, July, October).
            Artifacts go in docs/okrs/ in the format docs/okrs/README.md
            defines. Commit on a branch named okr/YYYY-MM, push it, and open
            exactly one pull request with `gh pr create`. You write only
            docs/okrs/ and dated notes in docs/ideas.md. Never edit vision.md,
            charters, sprints, or code. Never merge your own PR, never push to
            main, never touch secrets or digests/. If the charter file is
            missing, stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions --model claude-sonnet-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      #
      # The logic is in tools/run_report.py, not here, because shell embedded
      # in YAML cannot be tested and this step shipped broken to twelve
      # workflows at once (INC-2026-09-26-run-report-dash-echo). The webhook
      # guard stays inside the script for the reason the previous version's
      # comment gave: a step cannot read its own `env:` block from `if:`.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 tools/run_report.py --workflow "${{ github.workflow }}" --status "${{ job.status }}"

      # The board (docs/board.md), which pm.md §14 makes the state of the work.
      # Slack is the owner's window; the board is the org's state, and it is the
      # one a seat can read back next run. This step cannot fail the job:
      # tools/board.py prints ::warning:: and exits 0 when the board refuses,
      # because a red job for an undelivered report is the lie
      # INC-2026-09-26-run-report-dash-echo told six times.
      - name: Post run report to the board
        if: always()
        run: python3 tools/board.py report --status ${{ job.status }}
