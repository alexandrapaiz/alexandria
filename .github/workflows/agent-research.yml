name: research-agent

on:
  schedule:
    - cron: "30 16 * * 1" # Mondays 16:30 UTC, after the 15:00 UTC digest cron
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      NEON_RO_URL: ${{ secrets.NEON_RO_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are alexandria's research agent, the input curator (prompts/research-agent.md;
            ADR-11 and ADR-12 in docs/decisions.md), running in GitHub Actions
            with this repository already checked out, on Mondays after the
            digest cron has published. Read docs/vision.md section 0, the
            newest file in docs/okrs/, and then prompts/research-agent.md; the
            charter's steps are your instruction set, with two adaptations for
            this runner. First, data access: read the corpus read-only through
            the NEON_RO_URL environment variable with psql when it is set; if
            it is unset, say so at the top of your PR and do only the
            repo-side work. Use the discovery_report queries documented in
            docs/product/source-discovery.md as SQL directly when reviewing
            sources. Second, division of labor: drafting new skills now
            belongs to the dedicated skill agent (ADR-22), so skip the
            skill-drafting step; your lane is the digest quality review, the claim-graph
            error hunt, the CURATION BRIEF (charter step 2b, the output the
            PM and skill agent plan from), and the meta-review, proposing diffs to
            prompts/*.md and sources.yaml (the ADR-12 whitelist) when the
            week's evidence justifies one, at most one system diff per week.
            Commit on a branch named research/YYYY-MM-DD and open exactly one
            pull request with `gh pr create`. Never write to the database,
            never print credentials, never merge your own PR, never push to
            main, never touch digests/ or skills/. If the charter file is
            missing, stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 180 --permission-mode bypassPermissions --model claude-opus-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The guard lives in the script, not in the step's `if`: a step
          # cannot read its own `env:` block from its `if` condition, and the
          # `secrets` context is not available there either, so gating in YAML
          # would either always skip or leak the webhook into the job env that
          # the seat itself can read.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL configured; the visibility window is not open yet."
            exit 0
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          pr=$(gh pr list --head "$branch" --state all --json number,title,url,body --jq '.[0]' 2>/dev/null)
          title=$(echo "$pr" | jq -r '.title // "no PR opened"'); url=$(echo "$pr" | jq -r '.url // ""')
          # Prose, not a log line (owner, 2026-09-26: "communications are pretty dead on slack"):
          # the report is the PR description's opening — its first paragraphs, up to ~900 chars.
          summary=$(echo "$pr" | jq -r '.body // ""' | sed -e 's/^#\+ *//' -e '/^🤖/d' -e '/^$/N;/^\n$/D' | tr -s '\n' | head -c 900)
          curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "$(jq -nc --arg t "*${{ github.workflow }}* · ${{ job.status }} · $title" --arg s "$summary" --arg u "$url" '{text: ($t + (if $s != "" then "\n" + $s else "" end) + (if $u != "" then "\n" + $u else "" end))}')" >/dev/null || true
