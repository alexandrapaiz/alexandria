name: market-agent

on:
  schedule:
    - cron: "0 11 * * 5" # 7:00 AM ET Fridays
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # owner 2026-09-24: the ranking run hands its result to the PM by dispatch
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENROUTE: ${{ secrets.OPENROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
      # Traces: this run lands in Langfuse as one trace, a span per tool call
      # (runtime/langfuse/ in the HQ repo). The auth header is set by the step below.
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.LANGFUSE_HOST }}/api/public/otel
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_ASSISTANT_RESPONSES: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
      OTEL_RESOURCE_ATTRIBUTES: service.name=alexandria-market,langfuse.environment=alexandria,langfuse.user.id=market,langfuse.session.id=${{ github.run_id }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Open routing is best-effort: Moonshot's prepaid tier allows almost no
      # concurrency, and three runs (2026-09-21 x2, 2026-09-24) died at turn one
      # while another Kimi run was in progress. If this step fails, the Claude
      # step below runs instead on the subscription (HQ Incident 4).
      - name: Trace this run to Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "No Langfuse keys on this repo; this run is not traced."
            echo "OTEL_TRACES_EXPORTER=none" >> "$GITHUB_ENV"; exit 0
          fi
          auth=$(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 -w0)
          echo "::add-mask::$auth"
          echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic $auth" >> "$GITHUB_ENV"
          echo "Traced: seat market of alexandria, run ${{ github.run_id }}."
      - name: Seat run (open-routed)
        id: openrouted
        if: env.OPENROUTE != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OPENROUTE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTE_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTE_API_KEY }}
          prompt: |
            You are alexandria's market research agent (ADR-17 in
            docs/decisions.md), running in GitHub Actions with this repository
            already checked out. Read docs/vision.md section 0, then
            prompts/market-agent.md; the charter is your full instruction set.
            Execute the four Friday ceremonies exactly as it specifies:
            landscape watch, demand signals, positioning and pricing, and the
            one-page brief in docs/market/briefs/YYYY-MM-DD.md. Research is
            read-only on free public web surfaces; never create accounts,
            post, contact anyone, or scrape behind paywalls, and every market
            claim needs a linked source. Commit on a branch named
            market/YYYY-MM-DD, push it, and open exactly one pull request with
            `gh pr create`. You write only docs/market/ and proposed entries
            or dated notes in docs/ideas.md. Never merge your own PR, never
            push to main, never touch secrets or digests/. If the charter file
            is missing, stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions --model ${{ vars.OPENROUTE_MODEL || 'kimi-k2.7-code' }}"
      - name: Seat run (Claude)
        if: env.OPENROUTE == '' || steps.openrouted.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are alexandria's market research agent (ADR-17 in
            docs/decisions.md), running in GitHub Actions with this repository
            already checked out. Read docs/vision.md section 0, then
            prompts/market-agent.md; the charter is your full instruction set.
            Execute the four Friday ceremonies exactly as it specifies:
            landscape watch, demand signals, positioning and pricing, and the
            one-page brief in docs/market/briefs/YYYY-MM-DD.md. Research is
            read-only on free public web surfaces; never create accounts,
            post, contact anyone, or scrape behind paywalls, and every market
            claim needs a linked source. Commit on a branch named
            market/YYYY-MM-DD, push it, and open exactly one pull request with
            `gh pr create`. You write only docs/market/ and proposed entries
            or dated notes in docs/ideas.md. Never merge your own PR, never
            push to main, never touch secrets or digests/. If the charter file
            is missing, stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions --model claude-sonnet-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The guard lives in the script, not in the step's `if`: a step
          # cannot read its own `env:` block from its `if` condition, and the
          # `secrets` context is not available there either, so gating in YAML
          # would either always skip or leak the webhook into the job env that
          # the seat itself can read.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL configured; the visibility window is not open yet."
            exit 0
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          pr=$(gh pr list --head "$branch" --state all --json number,title,url,body --jq '.[0]' 2>/dev/null)
          title=$(echo "$pr" | jq -r '.title // "no PR opened"'); url=$(echo "$pr" | jq -r '.url // ""')
          # Prose, not a log line (owner, 2026-09-26: "communications are pretty dead on slack"):
          # the report is the PR description's opening — its first paragraphs, up to ~900 chars.
          # Bullets, not paragraphs (owner, 2026-09-26: "make the slack prose be in bullets"):
          # the first five bullet lines of the PR description, each cut to one line; a
          # description with no bullets yields its first two lines.
          summary=$(echo "$pr" | jq -r '.body // ""' | grep -E '^\s*[-*•] ' | head -5 | sed -E 's/^\s*[-*•] +/• /; s/\*\*//g' | cut -c1-180)
          [ -n "$summary" ] || summary=$(echo "$pr" | jq -r '.body // ""' | sed -e '/^#/d' -e '/^🤖/d' -e '/^\s*$/d' | head -2 | cut -c1-180 | sed 's/^/• /')
          curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "$(jq -nc --arg t "*${{ github.workflow }}* · ${{ job.status }} · $title" --arg s "$summary" --arg u "$url" '{text: ($t + (if $s != "" then "\n" + $s else "" end) + (if $u != "" then "\n" + $u else "" end))}')" >/dev/null || true
