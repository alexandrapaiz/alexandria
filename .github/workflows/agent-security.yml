name: security-agent

on:
  schedule:
    - cron: "0 13 1,15 * *" # 9:00 AM ET, 1st and 15th of the month
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are alexandria's debug and cybersecurity agent (ADR-20 in
            docs/decisions.md), running in GitHub Actions with this
            repository already checked out at full depth. Read
            prompts/security-agent.md; it is your full charter. Execute both
            sweeps exactly as it specifies: the debug sweep (workflow
            failures, builds, tests, defects in recent diffs, small safe
            fixes) and the defensive security audit (secrets in tree and
            history, dependencies, the public/private boundary, the MCP
            server, workflow security, prompt injection surface), with the
            audit report at docs/security/audit-YYYY-MM-DD.md. Never print
            or commit a secret value. Commit on a branch named
            sec/YYYY-MM-DD and open exactly one pull request with `gh pr
            create`, severe findings in bold at the top. Never merge your
            own PR, never push to main, never touch digests/. If the
            charter file is missing, stop and fail loudly instead of
            improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 250 --permission-mode bypassPermissions --model claude-opus-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          base="${GITHUB_REF_NAME:-main}"
          dirty=$(git status --porcelain)
          commits=0
          if git rev-parse "origin/$base" >/dev/null 2>&1; then
            commits=$(git rev-list --count "origin/$base..HEAD" 2>/dev/null || echo 0)
          fi
          # Remote branches containing HEAD, EXCLUDING the base branch itself. A run
          # that never branched leaves HEAD on origin/$base, which used to satisfy
          # this check trivially: epitome run 35956231272 (2026-09-24) died at turn
          # one, produced nothing, and the tripwire still reported success.
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ' | grep -v "^origin/$base$" || true)
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\` ($commits commit(s) ahead of $base)"
            echo "- pushed to a seat branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ "$commits" = "0" ] && [ -z "$pr" ] && [ -z "$dirty" ]; then
            echo "::error::This run produced nothing at all: no commit, no seat branch, no pull request. A green model step is not evidence of work; read the seat run step's own outcome."
            exit 1
          fi
          if [ "$commits" != "0" ] && [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      #
      # The logic is in tools/run_report.py, not here, because shell embedded
      # in YAML cannot be tested and this step shipped broken to twelve
      # workflows at once (INC-2026-09-26-run-report-dash-echo). The webhook
      # guard stays inside the script for the reason the previous version's
      # comment gave: a step cannot read its own `env:` block from `if:`.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 tools/run_report.py --workflow "${{ github.workflow }}" --status "${{ job.status }}"

      # The board (docs/board.md), which pm.md §14 makes the state of the work.
      # Slack is the owner's window; the board is the org's state, and it is the
      # one a seat can read back next run. This step cannot fail the job:
      # tools/board.py prints ::warning:: and exits 0 when the board refuses,
      # because a red job for an undelivered report is the lie
      # INC-2026-09-26-run-report-dash-echo told six times.
      - name: Post run report to the board
        if: always()
        run: python3 tools/board.py report --status ${{ job.status }}
