name: pm-agent

on:
  schedule:
    - cron: "35 10 * * 1"     # Monday: the ceremony run (charter §0)
    - cron: "5 11 * * 0,2-6"  # every other day: the standup run (charter §4, standard §11)
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # charter §5 v3: the standup dispatches other seats with GITHUB_TOKEN
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENROUTE: ${{ secrets.OPENROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PM_DISPATCH_ENABLED: ${{ vars.PM_DISPATCH_ENABLED }}
      RUN_MODE: ${{ github.event.schedule == '35 10 * * 1' && 'ceremony' || (github.event_name == 'schedule' && 'standup' || 'dispatch') }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Open routing is best-effort: Moonshot's prepaid tier allows almost no
      # concurrency, and three runs (2026-09-21 x2, 2026-09-24) died at turn one
      # while another Kimi run was in progress. If this step fails, the Claude
      # step below runs instead on the subscription (HQ Incident 4).
      - name: Seat run (open-routed)
        id: openrouted
        if: env.OPENROUTE != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OPENROUTE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTE_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTE_API_KEY }}
          prompt: |
            You are alexandria's project manager agent (ADR-15 in
            docs/decisions.md), running in GitHub Actions with this repository
            already checked out. Read prompts/pm-agent.md; it is your full
            charter. Execute the three Monday ceremonies exactly as it
            specifies: retrospective on the ending sprint, grooming of
            docs/ideas.md, and the new sprint file in docs/sprints/ in the
            format docs/sprints/README.md defines. Commit on a branch named
            pm/sprint-YYYY-MM-DD (this Monday's date), push it, and open
            exactly one pull request with `gh pr create`. You write only
            docs/sprints/ and grooming notes in docs/ideas.md. Never write
            code, never edit charters, never merge your own PR, never push to
            main, never touch secrets or digests/. If the charter file is
            missing, stop and fail loudly instead of improvising.
            Run mode for this run: ${{ env.RUN_MODE }} (ceremony = charter
            §1–§4; standup = §4 alone; dispatch = decide from the date and the
            owner instructions). PM_DISPATCH_ENABLED is
            "${{ vars.PM_DISPATCH_ENABLED }}": fire dispatches only when it is
            exactly true, under charter §5 and docs/standards/pm.md §11.4.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 300 --permission-mode bypassPermissions --model ${{ vars.OPENROUTE_MODEL || 'kimi-k2.7-code' }}"
      - name: Seat run (Claude)
        if: env.OPENROUTE == '' || steps.openrouted.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are alexandria's project manager agent (ADR-15 in
            docs/decisions.md), running in GitHub Actions with this repository
            already checked out. Read prompts/pm-agent.md; it is your full
            charter. Execute the three Monday ceremonies exactly as it
            specifies: retrospective on the ending sprint, grooming of
            docs/ideas.md, and the new sprint file in docs/sprints/ in the
            format docs/sprints/README.md defines. Commit on a branch named
            pm/sprint-YYYY-MM-DD (this Monday's date), push it, and open
            exactly one pull request with `gh pr create`. You write only
            docs/sprints/ and grooming notes in docs/ideas.md. Never write
            code, never edit charters, never merge your own PR, never push to
            main, never touch secrets or digests/. If the charter file is
            missing, stop and fail loudly instead of improvising.
            Run mode for this run: ${{ env.RUN_MODE }} (ceremony = charter
            §1–§4; standup = §4 alone; dispatch = decide from the date and the
            owner instructions). PM_DISPATCH_ENABLED is
            "${{ vars.PM_DISPATCH_ENABLED }}": fire dispatches only when it is
            exactly true, under charter §5 and docs/standards/pm.md §11.4.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 300 --permission-mode bypassPermissions --model claude-sonnet-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The guard lives in the script, not in the step's `if`: a step
          # cannot read its own `env:` block from its `if` condition, and the
          # `secrets` context is not available there either, so gating in YAML
          # would either always skip or leak the webhook into the job env that
          # the seat itself can read.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL configured; the visibility window is not open yet."
            exit 0
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          pr=$(gh pr list --head "$branch" --state all --json number,title,url --jq '.[0]' 2>/dev/null)
          title=$(echo "$pr" | jq -r '.title // "no PR opened"'); url=$(echo "$pr" | jq -r '.url // ""')
          curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "$(jq -nc --arg t "${{ github.workflow }} · ${{ job.status }} · $title" --arg u "$url" '{text: ($t + (if $u != "" then "\n" + $u else "" end))}')" >/dev/null || true
