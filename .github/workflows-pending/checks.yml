# Does the press still fit?
#
# Incident 22 (docs/agents/incidents.md): an editorial merge grew the digest
# generator's prompt past the model's per-request token ceiling. Nothing in the
# repository noticed, and the next scheduled run answered 413 with no issue
# written. This workflow is the thing that notices, before a merge rather than
# after one.
#
# It runs on any change to a generator prompt or the pipeline, which is exactly
# the set of changes that can move the sum. The writer seat's editorial merges
# are inside that set on purpose: the laws are hers, the budget is the
# engineer's, and this is where the two meet.
name: checks

on:
  pull_request:
    paths:
      - "prompts/digest.md"
      - "prompts/daily.md"
      - "pipeline/**"
      - "tests/test_press_resilience.py"
      - "tests/test_email_template.py"
      - "tests/test_press_rehearsal.py"
      - "tests/test_corpus_drain.py"
      - "tests/test_rag_fallback.py"
      - "tests/test_reasoning_rubric.py"
      - "tests/test_board.py"
      - "tests/test_run_report.py"
      - "tests/test_distill_gates.py"
      - "tests/test_distill_fulltext_budget.py"
      - "tests/test_skill_receipts.py"
      - "tests/test_graph_audit.py"
      - "skills/**"
      - "site/lib/skill-provenance.js"
      - "tools/board.py"
      - "tools/run_report.py"
      - "tools/graph_audit.py"
      - "db/schema.sql"
      - "site/emails/digest.html"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "prompts/digest.md"
      - "prompts/daily.md"
      - "pipeline/**"
      - "tests/test_press_resilience.py"
      - "tests/test_email_template.py"
      - "tests/test_press_rehearsal.py"
      - "tests/test_corpus_drain.py"
      - "tests/test_rag_fallback.py"
      - "tests/test_reasoning_rubric.py"
      - "tests/test_board.py"
      - "tests/test_run_report.py"
      - "tests/test_distill_gates.py"
      - "tests/test_distill_fulltext_budget.py"
      - "tests/test_skill_receipts.py"
      - "tests/test_graph_audit.py"
      - "skills/**"
      - "site/lib/skill-provenance.js"
      - "tools/board.py"
      - "tools/run_report.py"
      - "tools/graph_audit.py"
      - "db/schema.sql"
      - "site/emails/digest.html"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest-budget:
    name: digest request fits the model's budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tiktoken makes the count exact. budget.py falls back to a pessimistic
      # chars-per-token ratio without it, so a failure to install would make
      # the guard stricter, never laxer.
      - name: install the tokenizer
        run: pip install "tiktoken==0.8.0"

      # The corpus tests use pytest fixtures (monkeypatch, capsys), so unlike
      # the three files below they cannot be run as scripts. One install, and
      # it is the same file the repo's own test command names.
      - name: install the test dependencies
        run: pip install -r requirements-dev.txt

      - name: prompt + worst-case payload + output reservation vs the limit
        run: python3 pipeline/budget.py

      # Incident 24: the budget guard checked that the request fits and nothing
      # checked that the model exists. These tests cover the paths that only run
      # on a bad day, which is exactly the set nothing had ever exercised: the
      # 404 hand-off down the fallback list, 429 backoff, and the owner alarm.
      # No key, no network, no database.
      #
      # `always()` on purpose: the budget step above fails today, for a real
      # reason (incident 24, the 8,000 TPM ceiling), and a red build there must
      # not hide whether the resilience paths still work.
      - name: the press survives a provider that changed under it
        if: always()
        run: python3 tests/test_press_resilience.py

      # The owner's ruling of 2026-09-24: the emails had no UI, only the site
      # did. The template had been in the repo for five days and the press had
      # never opened it. These tests hold that seam: the press reaches the
      # template, the image carries it, every slot fills, and the send keeps
      # its plain-text part and its editorial subject.
      #
      # `site/emails/digest.html` is in this workflow's paths for the same
      # reason. The template is the frontend seat's file and the renderer is
      # the engineer's, so a change to one that breaks the other is a
      # cross-seat break, which is the kind CI exists to catch.
      - name: the press sends the designed email
        if: always()
        run: python3 tests/test_email_template.py

      # INC-2026-09-24-press-provider-migration: four failures in one evening,
      # every one of them an integration property that only a real call
      # reveals. `rehearse()` is that call, and it is the third gate in
      # docs/agents/runtime-changes.md's ladder. CI cannot run the gate, since
      # a real call needs a real key and real money. What CI can hold is that
      # the gate still has its teeth: that a rehearsal never writes to
      # `digests`, never mounts a mail credential, never holds a connection
      # open across the model call, prints all three subject lines, and
      # refuses a receipt that names a different model or a different prompt.
      - name: the rehearsal writes to a scratch row and sends to nobody
        if: always()
        run: python3 tests/test_press_rehearsal.py

      # 2026-09-26: triage and interpret moved to Moonshot's Kimi with a spend
      # cap (ADR-2026-09-26). The same argument as the rehearsal step above
      # applies twice over here. CI cannot run the gate, because the gate is
      # `modal run pipeline/triage.py::rehearse` with a real key and real money.
      # What CI holds is that the gate has teeth and that the money has a
      # ceiling: that the cap is measured from the provider's usage block and
      # checked before a call rather than after, that a 429 waits on our own
      # schedule rather than the 1-second hint Moonshot's concurrency refusal
      # sends, that the grading backfill touches only ungraded rows, and that no
      # two Kimi jobs share a window.
      #
      # `budget.py` above already fails the build if a per-run cap is raised
      # past the ceiling in docs/finance/opex.md, or if two Kimi windows
      # overlap, or if a Groq fallback cannot take the job's own request.
      - name: the corpus drains within its cap, and the cap has teeth
        if: always()
        run: python3 -m pytest tests/test_corpus_drain.py tests/test_rag_fallback.py -q

      # 2026-09-26, the same evening: the reasoning rubric (ADR-2026-09-26b).
      # Three properties CI is the only place to hold. The topic list the model
      # is offered in `prompts/distill.md` and the list the insert accepts in
      # `pipeline/topics.py` are parsed and compared, so a tag added to one and
      # not the other fails here instead of being dropped silently on every
      # claim for months. No consumer joins `triage_log` expecting one row per
      # paper, which is now false. And the re-triage keeps the guard that makes
      # it idempotent, because a re-triage that forgets which prompt judged a
      # paper will judge it again every time it runs.
      - name: the taxonomy is closed, and a paper may have a decision history
        if: always()
        run: python3 -m pytest tests/test_reasoning_rubric.py -q
      # 2026-09-28: the board client (docs/board.md). The board itself is the
      # owner's server now (ADR-2026-09-28-board-client), so what this build
      # protects is the client's four properties. A report lands exactly once,
      # because the step runs under `if: always()` and the board's server
      # implements no DELETE, so a duplicate row is permanent. A seat cannot
      # invent a company, a sprint, a column or a view, which is pm.md §14's
      # permission line and is enforced here by the parser having no such
      # command. A board that cannot be written exits 0, because twelve seats'
      # runs must not go red over a notification. And the runtime token never
      # reaches stdout or stderr on any path, including every error path.
      #
      # These tests run a real HTTP server on localhost and never touch
      # board.libraryofalexandria.dev, because run reports there are
      # append-only and a suite that posted to it would leave a row behind on
      # every green run.
      - name: the board client, against a board that is not the company's
        if: always()
        run: python3 -m pytest tests/test_board.py -q

      # INC-2026-09-26-run-report-dash-echo: the run report step ran under the
      # container's `sh`, which is dash, and dash's builtin `echo` expanded the
      # escaped newlines inside the pull request body before `jq` read it. Every
      # run of every seat failed, and two runs that had finished their work and
      # opened their pull requests were recorded as crashes.
      #
      # It shipped to twelve live workflows at once because shell embedded in
      # YAML has nowhere to be tested. The logic is `tools/run_report.py` now,
      # and this is the step that holds it. One of these tests runs the script
      # under `sh -e`, which is the exact shell the workflow hands a step that
      # declares no `shell:` key, so the shell that caused the incident is
      # under test rather than in production.
      - name: the run report survives the container's shell
        if: always()
        run: python3 -m pytest tests/test_run_report.py -q

      # 2026-09-26: distill had none of the three gates, which is how the job
      # whose purpose is reading papers in full came to be unable to read one.
      # CI cannot run gates 2 and 3, because both need a real key. What it holds
      # is that they have teeth: that the rehearsal carries no Neon credential
      # and so cannot write a claim, that it sends a full FULLTEXT_CHARS payload
      # at the real timeout rather than a smaller one, that a refused full paper
      # stops the deploy instead of passing on the abstract, and that an
      # off-taxonomy topic stops it too. The last one is incident 30.
      - name: distill cannot deploy without proving it can read a paper
        if: always()
        run: python3 -m pytest tests/test_distill_gates.py -q

      # 2026-09-27, INC-2026-09-27-filler-tokenizes-cheaper-than-a-paper. The
      # guard above sizes distill's payload with filler, because the real
      # payload is in a database it cannot reach, and for a year that filler was
      # English prose at 6.17 chars/token standing in for an arXiv paper at
      # 3.35. Everything downstream of that was wrong by up to 69%, including
      # the "misses by 109 tokens" that four documents then quoted.
      #
      # This step is the check that the estimate still resembles the thing.
      # It needs no network: `tools/fulltext_density.py` does the measuring
      # against live arXiv when a person runs it, and writes the receipt in
      # docs/evals/ that these tests read.
      - name: the guard sizes a paper as a paper, and the gate is harder than the job
        if: always()
        run: python3 -m pytest tests/test_distill_fulltext_budget.py -q

      # 2026-09-29, sprint 2026-09-28 item 3. The skill library's provenance
      # block is the library's own product claim, and it had rendered as blank
      # for eleven days because the frontmatter reader anchored its key regex at
      # column 0 against a file whose every provenance field is indented. That
      # defect is invisible by construction: the page renders, it just says
      # nothing. So the check is executed rather than read, and the last
      # assertion is the one that matters over time. Every skill's receipt is
      # pinned by sha to the exact SKILL.md text on the page, so editing a skill
      # without re-running `python3 skills/_validation/trigger_test.py` turns
      # this step red on the pull request that does it, instead of quietly
      # publishing a pass rate for a document nobody can see.
      - name: the skill library shows its receipts, and they describe today's text
        if: always()
        run: python3 -m pytest tests/test_skill_receipts.py -q

      # 2026-09-29, the graph audit. Two of these tests are the reason the file
      # is in this workflow at all: `tools/graph_audit.py` holds ten SELECTs
      # that no CI job anywhere can execute, because this org runs no database
      # in CI and the only Postgres that matters is the production one. So the
      # queries are parsed with libpg_query and every relation and column they
      # name is resolved against db/schema.sql, which is why that file is in
      # the paths above. A migration that renames a column turns this step red
      # instead of turning the audit red the first time somebody points it at
      # Neon. Both gates were confirmed to fail on a deliberate typo before
      # this step was written.
      - name: the graph audit's SQL still matches the schema, and still only reads
        if: always()
        run: python3 -m pytest tests/test_graph_audit.py -q
