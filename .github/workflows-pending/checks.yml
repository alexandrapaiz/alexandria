# Does the press still fit?
#
# Incident 22 (docs/agents/incidents.md): an editorial merge grew the digest
# generator's prompt past the model's per-request token ceiling. Nothing in the
# repository noticed, and the next scheduled run answered 413 with no issue
# written. This workflow is the thing that notices, before a merge rather than
# after one.
#
# It runs on any change to a generator prompt or the pipeline, which is exactly
# the set of changes that can move the sum. The writer seat's editorial merges
# are inside that set on purpose: the laws are hers, the budget is the
# engineer's, and this is where the two meet.
name: checks

on:
  pull_request:
    paths:
      - "prompts/digest.md"
      - "prompts/daily.md"
      - "pipeline/**"
      - "tests/test_press_resilience.py"
      - "tests/test_email_template.py"
      - "site/emails/digest.html"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "prompts/digest.md"
      - "prompts/daily.md"
      - "pipeline/**"
      - "tests/test_press_resilience.py"
      - "tests/test_email_template.py"
      - "site/emails/digest.html"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest-budget:
    name: digest request fits the model's budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tiktoken makes the count exact. budget.py falls back to a pessimistic
      # chars-per-token ratio without it, so a failure to install would make
      # the guard stricter, never laxer.
      - name: install the tokenizer
        run: pip install "tiktoken==0.8.0"

      - name: prompt + worst-case payload + output reservation vs the limit
        run: python3 pipeline/budget.py

      # Incident 24: the budget guard checked that the request fits and nothing
      # checked that the model exists. These tests cover the paths that only run
      # on a bad day, which is exactly the set nothing had ever exercised: the
      # 404 hand-off down the fallback list, 429 backoff, and the owner alarm.
      # No key, no network, no database.
      #
      # `always()` on purpose: the budget step above fails today, for a real
      # reason (incident 24, the 8,000 TPM ceiling), and a red build there must
      # not hide whether the resilience paths still work.
      - name: the press survives a provider that changed under it
        if: always()
        run: python3 tests/test_press_resilience.py

      # The owner's ruling of 2026-09-24: the emails had no UI, only the site
      # did. The template had been in the repo for five days and the press had
      # never opened it. These tests hold that seam: the press reaches the
      # template, the image carries it, every slot fills, and the send keeps
      # its plain-text part and its editorial subject.
      #
      # `site/emails/digest.html` is in this workflow's paths for the same
      # reason. The template is the frontend seat's file and the renderer is
      # the engineer's, so a change to one that breaks the other is a
      # cross-seat break, which is the kind CI exists to catch.
      - name: the press sends the designed email
        if: always()
        run: python3 tests/test_email_template.py
