<title>Alexandria Claim Graph</title>
<style>
/* The site's system, read off site/app/globals.css: four tokens, one radius,
   Helvetica Neue, one ease curve with two clocks. Light only, as the site is. */
:root{ --ink:#000000; --paper:#ffffff; --gray:#86868b; --line:#e8e8e8; --radius:10px;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94); --fast:.1s; --slow:.16s; --red:#ff3b30; }
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:24px;padding-block:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
::selection{background:var(--ink);color:var(--paper)}
header{display:flex;flex-direction:column;gap:0}
.page-kicker{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--gray);margin-bottom:14px}
h1{font-size:clamp(32px,4.6vw,48px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
.page-intro{margin-top:14px;font-size:17px;color:var(--gray);max-width:540px}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:18px;font-size:13px;color:var(--gray);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--gray);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;user-select:none;transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease),background var(--slow) var(--ease)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip:hover{color:var(--ink)}
.chip b{font-weight:600}
.chip .ln{width:18px;height:0;border-top:1.5px solid var(--ink);display:inline-block}
.chip .ln.refines{border-top-style:dashed;border-top-color:var(--gray)}
.chip .ln.contradicts{border-top:2.5px solid var(--red)}
.chip .ln.duplicates{border-top:1.5px dotted var(--gray)}
.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--gray)}
input[type=search],select{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);min-width:200px;transition:border-color var(--fast) var(--ease)}
input[type=search]:hover,select:hover{border-color:var(--gray)}
.stage{flex:1;min-height:440px;display:grid;grid-template-columns:1fr 360px;gap:18px}
.canvas{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden;min-height:440px}
.canvas svg{width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;pointer-events:none;max-width:320px;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.4;padding:8px 11px;border-radius:8px;opacity:0;transform:translateY(2px);transition:opacity var(--fast) var(--ease),transform var(--slow) var(--ease);z-index:2}
.tip.on{opacity:1;transform:translateY(0)}
.tip .t{display:block;color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--gray);pointer-events:none}
aside{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:22px 24px;overflow:auto;min-height:0}
aside h2{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin:0 0 10px;text-wrap:balance}
aside .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0;color:var(--ink)}
aside .meta dt{color:var(--gray)}
aside .meta dd{margin:0}
.grade{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--gray)}
.grade.controlled,.grade.measured{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grade.asserted{border-color:var(--ink);color:var(--ink)}
.nb{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.nb li{border-top:1px solid var(--line);padding-top:10px;font-size:14px;cursor:pointer;color:var(--ink);transition:color var(--fast) var(--ease)}
.nb li:hover{color:var(--gray)}
.nb .r{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.r.contradicts{color:var(--red)}
.empty{color:var(--gray);font-size:15px}
.empty p{margin:0 0 12px}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;transition:text-decoration-color var(--fast) var(--ease)}
a:hover{text-decoration-color:var(--ink)}
.pt{font-size:12px;color:var(--gray);word-break:break-all;margin-top:2px}
@media (max-width:820px){ body{padding-inline:16px} .stage{grid-template-columns:1fr} aside{max-height:46vh} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<script>
const DATA = {"nodes":[{"id":2,"claim":"The training data are generated by reverse\u2011constructing multi\u2011hop question chains from a web\u2011page hyperlink graph and rewriting every non\u2011answer entity into a descriptive reference to prevent string\u2011matching shortcuts.","topics":["harness-engineering","skills"],"grade":"ungraded","paper":"arxiv:2609.04304","title":"Iris: Climbing to the Search Frontier","date":"2026-09-08"},{"id":3,"claim":"Iris uses a SFT\u2011RL climbing procedure that alternates supervised fine\u2011tuning on filtered trajectories with reinforcement learning against live search, interrupting over\u2011long rollouts at the request level and resuming from the committed prefix.","topics":["loop-engineering","post-training","serving"],"grade":"ungraded","paper":"arxiv:2609.04304","title":"Iris: Climbing to the Search Frontier","date":"2026-09-08"},{"id":4,"claim":"Inference\u2011time context management, which limits tool set, context length and uses a fixed judge, yields larger performance gains than most reported system differences on the evaluated benchmarks.","topics":["context-engineering","evals","memory"],"grade":"ungraded","paper":"arxiv:2609.04304","title":"Iris: Climbing to the Search Frontier","date":"2026-09-08"},{"id":5,"claim":"A single ReAct agent without sub\u2011agents or test\u2011time verification can solve the hardest rollouts and achieve top performance when combined with the above training and context management.","topics":["systems","skills"],"grade":"ungraded","paper":"arxiv:2609.04304","title":"Iris: Climbing to the Search Frontier","date":"2026-09-08"},{"id":6,"claim":"MaxKernel\u2019s multi\u2011agent system generates TPU kernels whose performance matches expert hand\u2011tuned baselines on the JaxBench suite and real\u2011world model workloads.","topics":["multi-agent","systems","evals"],"grade":"ungraded","paper":"arxiv:2609.04523","title":"MaxKernel: Agentic Kernel Generation for TPUs","date":"2026-09-08"},{"id":7,"claim":"A shared pool of specialized sub\u2011agents for planning, implementation, self\u2011debugging, testing, and hardware profiling enables both human\u2011in\u2011the\u2011loop and fully autonomous kernel generation paradigms.","topics":["harness-engineering","loop-engineering","multi-agent"],"grade":"ungraded","paper":"arxiv:2609.04523","title":"MaxKernel: Agentic Kernel Generation for TPUs","date":"2026-09-08"},{"id":8,"claim":"The autonomous metric\u2011 and trace\u2011driven optimization loop (Auto agent) produces significant performance gains across the benchmark without human intervention.","topics":["loop-engineering","multi-agent","evals"],"grade":"ungraded","paper":"arxiv:2609.04523","title":"MaxKernel: Agentic Kernel Generation for TPUs","date":"2026-09-08"},{"id":9,"claim":"Graph\u2011Based Autonomous Search scales the Auto agent to globally explore the kernel design space, further improving performance on large\u2011scale workloads.","topics":["multi-agent","systems","evals"],"grade":"ungraded","paper":"arxiv:2609.04523","title":"MaxKernel: Agentic Kernel Generation for TPUs","date":"2026-09-08"},{"id":10,"claim":"\u03c4^\u03c4-bench is a benchmark that makes end\u2011to\u2011end agent construction the evaluation task, providing developers with realistic client records, requirements, production APIs, codebases, and serving constraints.","topics":["evals","systems","harness-engineering"],"grade":"ungraded","paper":"arxiv:2609.04611","title":"\u03c4^\u03c4-Bench: An Environment for End-To-End, Realistic Agent Construction","date":"2026-09-08"},{"id":11,"claim":"The strongest tested configuration, Claude Opus\u202f5 under Claude Code, passes only 23.9% of the 53 evaluation simulations across four domains.","topics":["evals","post-training"],"grade":"ungraded","paper":"arxiv:2609.04611","title":"\u03c4^\u03c4-Bench: An Environment for End-To-End, Realistic Agent Construction","date":"2026-09-08"},{"id":12,"claim":"An expert\u2011authored reference implementation achieves an 82.2% success rate on the same benchmark, establishing a high ceiling.","topics":["evals","systems"],"grade":"ungraded","paper":"arxiv:2609.04611","title":"\u03c4^\u03c4-Bench: An Environment for End-To-End, Realistic Agent Construction","date":"2026-09-08"},{"id":13,"claim":"Common failure modes of current coding agents include issuing shallow queries instead of deep comprehension, minimal communication with the client, and insufficient experimentation with agent architecture and serving spend, leading to shipping the first design that runs.","topics":["skills","loop-engineering","serving"],"grade":"ungraded","paper":"arxiv:2609.04611","title":"\u03c4^\u03c4-Bench: An Environment for End-To-End, Realistic Agent Construction","date":"2026-09-08"},{"id":14,"claim":"\u03c4^\u03c4-bench is intended to turn cooperative agent building into a measurable target for coding agents.","topics":["evals","systems"],"grade":"ungraded","paper":"arxiv:2609.04611","title":"\u03c4^\u03c4-Bench: An Environment for End-To-End, Realistic Agent Construction","date":"2026-09-08"},{"id":15,"claim":"Boilerplate refusal statements cause models to rely on superficial cues, impairing discrimination between harmful and benign queries","topics":["post-training","evals"],"grade":"ungraded","paper":"arxiv:2609.04714","title":"Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models","date":"2026-09-08"},{"id":16,"claim":"Training language models on rationale\u2011only supervision reduces false refusals while preserving overall safety performance","topics":["post-training","evals"],"grade":"ungraded","paper":"arxiv:2609.04714","title":"Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models","date":"2026-09-08"},{"id":17,"claim":"The rationale\u2011only training benefit persists when models are used in in\u2011context learning settings","topics":["context-engineering","evals"],"grade":"ungraded","paper":"arxiv:2609.04714","title":"Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models","date":"2026-09-08"},{"id":18,"claim":"Rationale\u2011only supervision is compatible with existing inference\u2011time mitigation methods","topics":["harness-engineering","evals"],"grade":"ungraded","paper":"arxiv:2609.04714","title":"Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models","date":"2026-09-08"},{"id":19,"claim":"Precisely curated, fine\u2011grained safety supervision datasets are necessary for aligning helpfulness with safety","topics":["other"],"grade":"ungraded","paper":"arxiv:2609.04714","title":"Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models","date":"2026-09-08"},{"id":20,"claim":"When optimally configured, layer dropout reduces training loss for the same number of FLOPs compared to training without dropout.","topics":["other"],"grade":"ungraded","paper":"arxiv:2609.05275","title":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","date":"2026-09-08"},{"id":21,"claim":"Layer dropout allows up to a 25% reduction in training FLOPs while achieving comparable or lower validation loss for a fixed number of training steps.","topics":["other"],"grade":"ungraded","paper":"arxiv:2609.05275","title":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","date":"2026-09-08"},{"id":22,"claim":"Layer dropout enables post\u2011training inference optimizations\u2014early exit, intermediate\u2011layer skipping, and self\u2011speculative decoding\u2014that yield up to 1.5\u00d7 speedup with negligible accuracy loss.","topics":["post-training","systems"],"grade":"ungraded","paper":"arxiv:2609.05275","title":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","date":"2026-09-08"},{"id":23,"claim":"The benefits of layer dropout scale reliably from 271\u202fM\u2011parameter to 8.2\u202fB\u2011parameter models and datasets up to 160\u202fB tokens.","topics":["other"],"grade":"ungraded","paper":"arxiv:2609.05275","title":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","date":"2026-09-08"},{"id":24,"claim":"Best\u2011practice hyperparameters\u2014optimal layer distribution, time schedule, and optimizer settings\u2014are essential to realize the efficiency gains of layer dropout in LLM pre\u2011training.","topics":["other"],"grade":"ungraded","paper":"arxiv:2609.05275","title":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","date":"2026-09-08"},{"id":25,"claim":"OR-Clarify is a benchmark for pre\u2011formulation clarification that evaluates agents via bounded interaction with a simulated user, measuring slot recovery, stopping behavior, silent assumptions, and interaction cost.","topics":["evals","context-engineering"],"grade":"ungraded","paper":"arxiv:2609.05258","title":"Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization","date":"2026-09-08"},{"id":26,"claim":"InterOPT is a two\u2011stage framework that identifies unresolved formulation\u2011critical gaps and uses them to decide whether to ask the next question or to stop.","topics":["loop-engineering","skills"],"grade":"ungraded","paper":"arxiv:2609.05258","title":"Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization","date":"2026-09-08"},{"id":27,"claim":"In choice\u2011based experiments on OR\u2011Clarify, InterOPT substantially outperforms all baselines in exact slot recovery.","topics":["evals","skills"],"grade":"ungraded","paper":"arxiv:2609.05258","title":"Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization","date":"2026-09-08"},{"id":29,"claim":"The work reframes OR assistance as a selective completeness decision: clarify when needed, stop when ready, and quantify what remains missing.","topics":["systems","other"],"grade":"ungraded","paper":"arxiv:2609.05258","title":"Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization","date":"2026-09-08"},{"id":30,"claim":"RISE constructs a synthetic teacher directly from the model's own RLVR training trajectory, converting sparse outcome\u2011induced updates into dense per\u2011token supervision without any external model or privileged conditioning.","topics":["post-training","loop-engineering"],"grade":"ungraded","paper":"arxiv:2609.05295","title":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","date":"2026-09-08"},{"id":31,"claim":"RISE combines outcome\u2011based RLVR rewards with on\u2011policy distillation in a complementary loop where rewards ground the extrapolation and the extrapolated teacher refines token\u2011level decisions.","topics":["loop-engineering","post-training"],"grade":"ungraded","paper":"arxiv:2609.05295","title":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","date":"2026-09-08"},{"id":32,"claim":"Because the synthetic teacher is refreshed each iteration as the student improves, RISE implements recursive improvement rather than a one\u2011shot compression step.","topics":["loop-engineering","post-training"],"grade":"ungraded","paper":"arxiv:2609.05295","title":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","date":"2026-09-08"},{"id":33,"claim":"Across mathematical reasoning, multi\u2011domain STEM, code generation, and multi\u2011turn agentic tasks, RISE consistently outperforms both RLVR\u2011only training and on\u2011policy self\u2011distillation baselines.","topics":["evals","skills"],"grade":"ungraded","paper":"arxiv:2609.05295","title":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","date":"2026-09-08"},{"id":34,"claim":"Puffin-World unifies physics, geometry, and appearance as native world states with an Omni\u2011Camera representation, eliminating the need for external offline modules.","topics":["harness-engineering"],"grade":"ungraded","paper":"arxiv:2609.04196","title":"Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States","date":"2026-09-08"},{"id":35,"claim":"Propagating physical dynamics across future frames yields physically consistent and visually stable world generation.","topics":["loop-engineering"],"grade":"ungraded","paper":"arxiv:2609.04196","title":"Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States","date":"2026-09-08"},{"id":36,"claim":"Appearance and geometry are jointly synthesized, allowing simultaneous generation of future views and reconstruction of underlying geometry.","topics":["harness-engineering"],"grade":"ungraded","paper":"arxiv:2609.04196","title":"Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States","date":"2026-09-08"},{"id":37,"claim":"The unified paradigm enables interleaved closed\u2011loop applications such as mimic behavior and self\u2011calibrated world exploration.","topics":["loop-engineering","skills"],"grade":"ungraded","paper":"arxiv:2609.04196","title":"Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States","date":"2026-09-08"},{"id":38,"claim":"Scaling to the Puffin\u201116M dataset (15\u202fM vision\u2011language\u2011camera triplets and 1\u202fM trajectories) shows the architecture can handle complex, high\u2011motion scenarios.","topics":["systems","post-training"],"grade":"ungraded","paper":"arxiv:2609.04196","title":"Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States","date":"2026-09-08"},{"id":39,"claim":"DRACO generates rubrics dynamically during training to track the policy\u2019s evolving capability.","topics":["loop-engineering","other"],"grade":"ungraded","paper":"arxiv:2609.04094","title":"DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training","date":"2026-09-08"},{"id":40,"claim":"DRACO redistributes rubric scores over the steps responsible for each rubric to produce differentiated per\u2011step advantages in GRPO via a closed\u2011form formula without a learned attribution module.","topics":["loop-engineering"],"grade":"ungraded","paper":"arxiv:2609.04094","title":"DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training","date":"2026-09-08"},{"id":41,"claim":"On the AppWorld benchmark, DRACO improves performance by 15.9 points over the base model and by 5.3 points over GRPO trained with a sparse ground\u2011truth reward, despite not using any verifiers.","topics":["evals"],"grade":"ungraded","paper":"arxiv:2609.04094","title":"DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training","date":"2026-09-08"},{"id":42,"claim":"On the out\u2011of\u2011domain Tau\u2011Bench benchmark, DRACO gains 5.3 points over the base model and outperforms both ground\u2011truth\u2011reward training and other rubric\u2011based training settings, even without a frontier judge.","topics":["evals"],"grade":"ungraded","paper":"arxiv:2609.04094","title":"DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training","date":"2026-09-08"},{"id":43,"claim":"One-shot on-policy distillation (OPD) trained on a single query improves for hundreds of steps and recovers most of the performance gain of full-data OPD across task domains and model families.","topics":["post-training","other"],"grade":"ungraded","paper":"arxiv:2609.04172","title":"Rethinking On-Policy Distillation of Large Language Models II: One Training Example","date":"2026-09-08"},{"id":44,"claim":"A single query\u2019s rollouts cover 71.5% of the state space visited by full-data OPD, with most of that coverage achieved within the first 100 training steps.","topics":["post-training","other"],"grade":"ungraded","paper":"arxiv:2609.04172","title":"Rethinking On-Policy Distillation of Large Language Models II: One Training Example","date":"2026-09-08"},{"id":45,"claim":"Using 16 semantically diverse queries in OPD reaches 98.9% state coverage and matches the validation accuracy of full-data training.","topics":["post-training","other"],"grade":"ungraded","paper":"arxiv:2609.04172","title":"Rethinking On-Policy Distillation of Large Language Models II: One Training Example","date":"2026-09-08"},{"id":46,"claim":"The student\u2019s alignment with the teacher slows at a similar rate whether OPD trains on one query or the entire dataset, indicating the process is algorithm\u2011limited rather than data\u2011limited.","topics":["post-training","other"],"grade":"ungraded","paper":"arxiv:2609.04172","title":"Rethinking On-Policy Distillation of Large Language Models II: One Training Example","date":"2026-09-08"},{"id":47,"claim":"Multi\u2011teacher OPD attains full\u2011data performance with only 16 semantically diverse queries per domain, and content\u2011light templates or off\u2011domain queries can approximate the real\u2011query baseline.","topics":["post-training","other"],"grade":"ungraded","paper":"arxiv:2609.04172","title":"Rethinking On-Policy Distillation of Large Language Models II: One Training Example","date":"2026-09-08"},{"id":48,"claim":"The PACE dataset provides a benchmark for evaluating whether models can identify latent egocentric knowledge that renders user requests inappropriate.","topics":["evals","retrieval","other"],"grade":"ungraded","paper":"arxiv:2609.03293","title":"PACE: Towards Surfacing Hidden Conflicts in User Requests","date":"2026-09-08"},{"id":49,"claim":"PaceMaker, a multi\u2011agent framework with query reformulation, multi\u2011hop graph traversal, and conflict\u2011aware filtering agents, consistently outperforms existing methods on both evidence retrieval quality and conflict decision accuracy on the PACE benchmark.","topics":["multi-agent","retrieval","context-engineering"],"grade":"ungraded","paper":"arxiv:2609.03293","title":"PACE: Towards Surfacing Hidden Conflicts in User Requests","date":"2026-09-08"},{"id":50,"claim":"Implicit retrieval of user\u2011specific (egocentric) constraints is more difficult for current models than explicit retrieval, leading to lower conflict detection performance.","topics":["retrieval","memory","other"],"grade":"ungraded","paper":"arxiv:2609.03293","title":"PACE: Towards Surfacing Hidden Conflicts in User Requests","date":"2026-09-08"},{"id":51,"claim":"Coordinating specialized agents for query reformulation, graph traversal, and conflict filtering improves conflict detection compared to a single monolithic model.","topics":["multi-agent","loop-engineering","context-engineering"],"grade":"ungraded","paper":"arxiv:2609.03293","title":"PACE: Towards Surfacing Hidden Conflicts in User Requests","date":"2026-09-08"},{"id":52,"claim":"Integrating contextual evidence from egocentric knowledge bases leads to higher conflict decision accuracy than models that rely solely on the user request text.","topics":["retrieval","context-engineering","evals"],"grade":"ungraded","paper":"arxiv:2609.03293","title":"PACE: Towards Surfacing Hidden Conflicts in User Requests","date":"2026-09-08"},{"id":53,"claim":"HarvestBench is the first benchmark that quantifies how much LLM agents will pay to avoid harming living creatures by assigning a fuel\u2011price cost to swerve around animals.","topics":["evals"],"grade":"ungraded","paper":"arxiv:2609.04444","title":"HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals","date":"2026-09-08"},{"id":54,"claim":"Kill rates of LLM agents on HarvestBench range from 0.4% to 98.8% and are not ordered by model capability.","topics":["evals"],"grade":"ungraded","paper":"arxiv:2609.04444","title":"HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals","date":"2026-09-08"},{"id":56,"claim":"Providing a morality briefing reduces animal kill rates to under 6% for five of six reasoning models, whereas removing the briefing raises kill rates above 84% for all six.","topics":["evals"],"grade":"ungraded","paper":"arxiv:2609.04444","title":"HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals","date":"2026-09-08"},{"id":58,"claim":"A cross\u2011attentive reranker can resolve compositional attribute\u2011object bindings that standard MLLM embedding models miss","topics":["retrieval","post-training"],"grade":"ungraded","paper":"arxiv:2609.04083","title":"CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation","date":"2026-09-08"},{"id":59,"claim":"Distilling the reranker's fine\u2011grained rankings into the embedding model via a Rank\u2011KL objective improves compositional retrieval performance","topics":["retrieval","post-training"],"grade":"ungraded","paper":"arxiv:2609.04083","title":"CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation","date":"2026-09-08"},{"id":60,"claim":"Rank\u2011KL leverages multi\u2011level supervision more effectively than contrastive learning and CoSENT, achieving the strongest overall performance","topics":["retrieval","post-training"],"grade":"ungraded","paper":"arxiv:2609.04083","title":"CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation","date":"2026-09-08"},{"id":61,"claim":"CORE\u2011EMBED\u20118B attains the best total average (0.666) among all evaluated embedding models on compositional reasoning benchmarks","topics":["retrieval","post-training"],"grade":"ungraded","paper":"arxiv:2609.04083","title":"CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation","date":"2026-09-08"},{"id":62,"claim":"The compositional reasoning gains of CORE transfer to the MCMR benchmark without degrading performance on standard image\u2011text retrieval datasets lik
